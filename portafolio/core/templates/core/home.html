{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Perfil</title>

<link rel="stylesheet" href="{% static 'css/home.css' %}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="page-wrapper">

    <!-- PERFIL SUPERIOR -->
    <section class="profile-header">

        <div class="avatar-large">
            <img src="{% static 'img/avatar.png' %}" alt="avatar">
        </div>

        <div class="profile-info">
            <h1>Jugo Zuko</h1>
            <p>Dabrian · Quilpué, Valparaíso, Chile</p>
        </div>

        <div class="experience-box">
            <h2>Años de experiencia</h2>
            <div class="level-circle">1</div>

            <div class="career-box">
                <a href="{% static 'docs/titulo.pdf' %}" download>
                    Ingeniero en Informática
                </a>
            </div>

            <button class="button" onclick="openModal()">Modificar perfil</button>
        </div>

    </section>

    <div class="content">

        <!-- IZQUIERDA -->
        <div class="left-column">

            <div class="card achievements">
                <h2>Proyectos y Logros</h2>

                <div class="project-grid">
                    <div class="project"></div>
                    <div class="project"></div>
                    <div class="project"></div>
                    <div class="project"></div>
                    <div class="project"></div>
                    <div class="project more">+12</div>
                </div>

                <div class="stats">
                    <div>
                        <h3>12</h3>
                        <p>Proyectos</p>
                    </div>
                    <div>
                        <h3>4</h3>
                        <p>Clientes</p>
                    </div>
                    <div>
                        <h3>95%</h3>
                        <p>Efectividad</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- DERECHA -->
        <div class="right-column">

            <div class="card status">
                <h2>Disponible</h2>
            </div>

            <div class="card certificates">
                <h2>Certificados</h2>
                <div class="badge"></div>
                <div class="badge"></div>
                <div class="badge"></div>
                <div class="badge"></div>
                <div class="badge"></div>
            </div>

            <div class="card skills">
                <h2>Habilidades</h2>
                <div class="carousel">
                    <div class="carousel-track">
                        <img src="{% static 'img/html.png' %}">
                        <img src="{% static 'img/css.png' %}">
                        <img src="{% static 'img/js.png' %}">
                        <img src="{% static 'img/django.png' %}">
                        <img src="{% static 'img/php.png' %}">
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<!-- MODAL -->
<div class="modal" id="themeModal">
    <div class="modal-content">

        <h2>Personalizar perfil</h2>

        <h3>Fondos</h3>
        <div class="background-options">
            <div class="bg-preview" data-bg="bg1.jpg"></div>
            <div class="bg-preview" data-bg="bg2.jpg"></div>
            <div class="bg-preview" data-bg="bg3.jpg"></div>
            <div class="bg-preview" data-bg="bg4.jpg"></div>
        </div>

        <h3>Colores</h3>
        <div class="color-options">
            <div class="color ruby" data-color="ruby"></div>
            <div class="color lapis" data-color="lapis"></div>
            <div class="color gold" data-color="gold"></div>
            <div class="color silver" data-color="silver"></div>
        </div>

        <button onclick="closeModal()">Cerrar</button>
    </div>
</div>

<script src="{% static 'js/home.js' %}"></script>
</body>
</html>
